# One planted agent-security defect per expectation; report style: a hit
# requires the output to mention the file plus any keyword.
task: "Run /ds-agent-review on this branch."
tier: planted-defect
style: report
expectations:
  # Wildcard shell tool: allowed_commands "*" reached by shell=True.
  - file: agent/tools.py
    keywords: [least privilege, allowlist, wildcard, shell, execute_command]
  # Indirect prompt injection: attacker-authored email body is concatenated
  # into the prompt with a shell tool and an email tool available.
  - file: agent/tools.py
    keywords: [prompt injection, indirect, untrusted, email body]
  # No approval gate on send_email, and no depth/cost cap on the while loop.
  - file: agent/tools.py
    keywords: [approval, human-in-the-loop, unbounded, loop, cost]
  # Global memory with no per-user isolation, validation, or expiry.
  - file: agent/memory.py
    keywords: [memory, isolation, poisoning, shared, expiry]
