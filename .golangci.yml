version: "2"

linters:
  settings:
    errcheck:
      # These writes have no recovery path, so checking their error is noise:
      # CLI status lines go to a caller-provided io.Writer (a failed write to a
      # broken stdout can't itself be reported), the best-effort empty-dir
      # cleanup only fails when the dir wasn't empty — which is the intended
      # no-op — and the deferred temp-sandbox cleanup has no one to tell.
      exclude-functions:
        - charm.land/lipgloss/v2.Fprint
        - charm.land/lipgloss/v2.Fprintf
        - charm.land/lipgloss/v2.Fprintln
        - os.Remove
        - os.RemoveAll
