name: bench-report

# FR-16: a PR touching a covered skill (one with scenarios under evals/) or an
# agents-md block must carry a benchmark report — in the PR body or as a
# committed file.
# Presence only: no benchmark runs, no model tokens, no secrets (NFR-4).

on:
  pull_request:
    # edited included: the intended flow pastes the report into the PR body
    # after opening, and a body edit must re-run the presence check.
    types: [opened, edited, reopened, synchronize]
    paths: ["skills/**", "agents-md/**"]

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against the PR base needs its commit

      - name: check benchmark report presence
        env:
          # Via env, never inline: PR bodies are attacker-controlled text.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)

          covered=""
          for skill in $(printf '%s\n' "$changed" | sed -n 's|^skills/\([^/]*\)/.*|\1|p' | sort -u); do
            if find "evals/$skill" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | grep -q .; then
              covered="$covered $skill"
            fi
          done
          blocks=""
          if grep -q '^agents-md/' <<<"$changed"; then
            blocks=yes
          fi
          if [ -z "$covered" ] && [ -z "$blocks" ]; then
            echo "no covered skills or agents-md blocks touched — report not required"
            exit 0
          fi
          [ -n "$covered" ] && echo "covered skills touched:$covered"
          [ -n "$blocks" ] && echo "agents-md blocks touched"

          if printf '%s' "$PR_BODY" | grep -q "Bench report:"; then
            echo "benchmark report found in the PR body"
            exit 0
          fi
          for f in $(printf '%s\n' "$changed" | grep '\.md$' || true); do
            if [ -f "$f" ] && grep -q "^# Bench report:" "$f"; then
              echo "benchmark report committed: $f"
              exit 0
            fi
          done

          echo "::error::PR touches covered skills or agents-md blocks but carries no benchmark report. Run 'devskills bench <skill> --format pr-md' (with '--blocks <names>' for a block change) and paste the report into the PR body or commit it."
          exit 1
